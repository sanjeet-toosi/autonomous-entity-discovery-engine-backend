[project]
name = "business-graph-backend"
version = "0.1.0"
description = "Autonomous Business Graph Agent — control plane, execution plane, brain"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "tldextract>=5.1",
    "ddgs>=9.0",
    "neo4j>=5.20",
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "websockets>=12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "psycopg[binary]>=3.2"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
